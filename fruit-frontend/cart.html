<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Your Cart - Fresh Harvest</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <nav>
      <div class="logo">🍊 Fresh Harvest</div>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="shop.html">Shop</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
      <div class="cart">
        <a href="cart.html" class="active">🛒 
          <!-- <span id="cart-count">3</span> -->
        </a>
      </div>
    </nav>
  </header>
<main>
    <section class="section">
      <h2>Your Cart</h2>
      <table class="cart-table" id="cart-table">
        <tr><th>Product</th><th>Price</th><th>Qty</th><th>Total</th><th>Action</th></tr>
      </table>
      <h3 class="total" id="subtotal">Subtotal: $0.00</h3>
      <h3 id="checkout-summary"></h3>
      <button class="btn" onclick="checkout()">Proceed to Checkout</button>
      <button class="btn danger" onclick="clearCart()">Clear Cart</button>
    </section>
  </main>
  <footer>
    <p>© 2025 Fresh Harvest. All rights reserved.</p>
    <div class="socials">
      <a href="#">🐦</a>
      <a href="#">📘</a>
      <a href="#">📸</a>
    </div>
  </footer>
    <script src="js/main.js"></script>
    <script src="js/animation.js"></script>
    <script>
  function checkout() {
    const cart = JSON.parse(localStorage.getItem('cart')) || [];
    if (cart.length === 0) {
      alert("Your cart is empty!");
      return;
    }
    localStorage.setItem('checkoutCart', JSON.stringify(cart));
    window.location.href = 'checkout.html';
  }

  // Display cart data
  
  let cart = JSON.parse(localStorage.getItem('cart')) || [];
  let table = document.getElementById('cart-table');
  let subtotal = 0;

  cart.forEach((item, index) => {
  let price = parseFloat(item.price);
  let qty = parseInt(item.qty);
  let lineTotal = price * qty;
  subtotal += lineTotal;

  let row = document.createElement('tr');
  row.innerHTML = `
    <td>${item.name}</td>
    <td>$${price.toFixed(2)}</td>
    <td>${qty}</td>
    <td>$${lineTotal.toFixed(2)}</td>
    <td><button onclick="deleteItem(${index})">❌ Delete</button></td>
  `;
  table.appendChild(row);
});
  document.getElementById('subtotal').textContent = `Subtotal:$${subtotal.toFixed(2)}`;

  function deleteItem(index) {
  if (confirm("Are you sure you want to delete this product from your cart?")) {
    let cart = JSON.parse(localStorage.getItem('cart')) || [];
    cart.splice(index, 1);
    localStorage.setItem('cart', JSON.stringify(cart));
    location.reload();
  }
}

function clearCart() {
  if (confirm("Are you sure you want to clear your entire cart?")) {
    localStorage.removeItem('cart');
    location.reload();
  }
}

</script>

</body>
</html>
